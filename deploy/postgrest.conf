## /etc/autochess/postgrest.conf   (mode 0600, owner root)
##
## Contiene la password del ruolo di connessione: NON committare la versione
## compilata. Vedi SETUP_DB.md per la creazione del ruolo e la password.

db-uri       = "postgres://autochess_auth:CHANGE_ME@127.0.0.1:5432/autochess"
db-schemas   = "public"
## PostgREST si connette come autochess_auth (NOINHERIT) e fa SET ROLE a questo:
db-anon-role = "autochess_app"

server-host  = "127.0.0.1"
server-port  = 3000

db-pool      = 8

## Nessun JWT: PostgREST non è esposto, l'autenticazione è l'isolamento di rete.
## Nessuna riga jwt-secret di proposito.
